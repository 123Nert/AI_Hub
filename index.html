<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 情报站</title>
<style>
  :root {
    --bg: #0d1017; --bg2: #131722; --card: #1a2030; --card-hover: #202841;
    --line: #263048; --text: #e8ecf5; --muted: #8b94ab; --accent: #5b8cff; --accent2: #9a6bff;
    --official: #46d795; --blogger: #a674ff; --lab: #f5b544;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 20px 24px 60px; }

  header { display: flex; align-items: center; gap: 16px; padding: 8px 0 20px; flex-wrap: wrap; }
  .logo { font-size: 22px; font-weight: 700; letter-spacing: 1px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent; white-space: nowrap; }
  .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #3dd68c; }
  .dot.stale { background: #f5b544; }
  .dot.err { background: #ff5b5b; }
  .spacer { flex: 1; }
  #search {
    background: var(--card); border: 1px solid var(--line); color: var(--text);
    padding: 8px 14px; border-radius: 10px; width: 240px; font-size: 13px; outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #refresh {
    background: linear-gradient(90deg, var(--accent), var(--accent2)); border: none; color: #fff;
    padding: 8px 18px; border-radius: 10px; font-size: 13px; cursor: pointer; font-weight: 600;
  }
  #refresh:disabled { opacity: .5; cursor: wait; }

  .filterrow { display: flex; align-items: center; gap: 8px; padding-bottom: 10px; flex-wrap: wrap; }
  .flabel { font-size: 12px; color: var(--muted); width: 52px; text-align: right; flex-shrink: 0; }
  nav button, .frow button {
    background: var(--bg2); color: var(--muted); border: 1px solid var(--line);
    padding: 6px 14px; border-radius: 999px; font-size: 13px; cursor: pointer; transition: .15s;
  }
  nav button:hover, .frow button:hover { color: var(--text); }
  nav button.on, .frow button.on { background: linear-gradient(90deg, rgba(91,140,255,.18), rgba(154,107,255,.18));
    border-color: var(--accent); color: #cfe0ff; }
  #typeRow button[data-v="institution"].on { border-color: var(--lab); color: #ffda88; }
  .quick { display: flex; gap: 8px; align-items: center; margin: 2px 0 16px; flex-wrap: wrap; }
  .quick-label { font-size: 12px; color: var(--muted); }
  .quick button { background: rgba(245,181,68,.08); color: #e4bb69; border: 1px solid rgba(245,181,68,.28);
    padding: 5px 11px; border-radius: 999px; cursor: pointer; font-size: 12px; }
  .quick button:hover, .quick button.on { background: rgba(245,181,68,.2); color: #ffda88; }
  .sourcebar { display: flex; justify-content: space-between; align-items: center; color: var(--muted);
    font-size: 12px; padding: 1px 0 14px; }
  .sourcebar strong { color: var(--text); font-weight: 600; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 18px; display: flex; flex-direction: column; gap: 8px;
    transition: .15s; text-decoration: none; color: inherit; position: relative;
  }
  .card:hover { background: var(--card-hover); border-color: #35426a; transform: translateY(-2px); }
  .card.read { opacity: .5; }
  .card.read:hover { opacity: .9; }
  .badges { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding-right: 26px; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
  .newchip { font-size: 10px; font-weight: 800; letter-spacing: .5px; padding: 1px 7px;
    border-radius: 999px; background: #ff5b5b; color: #fff; }
  .star { position: absolute; top: 8px; right: 10px; background: none; border: none;
    cursor: pointer; font-size: 17px; line-height: 1; color: #39415a; padding: 4px; z-index: 1; }
  .star:hover { color: #8b94ab; }
  .star.on { color: #f5b544; }
  .cardbody { display: flex; gap: 12px; }
  .cardtext { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .thumb { flex-shrink: 0; width: 92px; height: 92px; border-radius: 10px; overflow: hidden; background: var(--bg2); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card h3 { font-size: 15px; line-height: 1.45; font-weight: 600; }
  .card p { font-size: 12.5px; color: var(--muted); line-height: 1.6;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { font-size: 11.5px; color: #5f6880; margin-top: auto; padding-top: 4px; }
  .loadmore { grid-column: 1 / -1; background: var(--bg2); border: 1px dashed var(--line);
    color: var(--muted); border-radius: 14px; padding: 14px; font-size: 13px; cursor: pointer; }
  .loadmore:hover { color: var(--text); border-color: var(--accent); }
  #sourceSel { background: var(--card); border: 1px solid var(--line); color: var(--text);
    padding: 5px 12px; border-radius: 999px; font-size: 13px; outline: none; max-width: 320px; cursor: pointer; }
  #sourceSel:focus { border-color: var(--accent); }
  .srcbar-right { display: flex; align-items: center; gap: 12px; }
  #readAllBtn { background: none; border: 1px solid var(--line); color: var(--muted);
    padding: 3px 11px; border-radius: 999px; font-size: 12px; cursor: pointer; }
  #readAllBtn:hover { color: var(--text); border-color: var(--accent); }

  .dupbtn { background: none; border: none; color: var(--accent); font-size: 11.5px; cursor: pointer; padding: 0; text-align: left; }
  .dupbtn:hover { text-decoration: underline; }
  .duplist { font-size: 11.5px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 9px; display: flex; flex-direction: column; gap: 4px; margin-top: 2px; }
  .dupitem { cursor: pointer; line-height: 1.5; }
  .dupitem:hover { color: var(--text); }
  .dupitem .dsrc { color: var(--accent); font-weight: 600; margin-right: 4px; }

  .skel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; height: 120px; position: relative; overflow: hidden; }
  .skel::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.05), transparent);
    animation: sweep 1.2s infinite; }
  @keyframes sweep { from { transform: translateX(-100%);} to { transform: translateX(100%);} }

  .empty { text-align: center; color: var(--muted); padding: 80px 0; font-size: 14px; }
  .srcnote { font-size: 12px; color: #f5b544; padding: 0 0 14px; }
  footer { margin-top: 40px; text-align: center; color: #454e63; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🤖 AI 情报站</div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">加载中…</span></div>
    <div class="spacer"></div>
    <input id="search" type="search" placeholder="搜索标题 / 摘要…">
    <button id="refresh">刷新</button>
  </header>
  <nav id="typeRow" class="filterrow">
    <span class="flabel">类型</span>
    <button data-v="all" class="on">全部</button>
    <button data-v="institution">🏢 官方机构</button>
    <button data-v="media">📰 官方媒体</button>
    <button data-v="blogger">✍ 博主 · UP主</button>
  </nav>
  <nav id="langRow" class="filterrow">
    <span class="flabel">语言</span>
    <button data-v="all" class="on">全部</button>
    <button data-v="cn">中文</button>
    <button data-v="en">English</button>
  </nav>
  <nav id="srcRow" class="filterrow">
    <span class="flabel">来源</span>
    <select id="sourceSel"><option value="all">全部来源</option></select>
  </nav>
  <div class="quick">
    <span class="quick-label">快捷视图</span>
    <button data-quick="recent">⚡ 最近 24 小时</button>
    <button data-quick="tools">🧰 工具 / 教程 / 工作流</button>
    <button data-quick="models">🧠 模型 / 发布 / 评测</button>
    <button data-quick="star">⭐ 收藏</button>
    <button data-quick="clear">清除快捷筛选</button>
  </div>
  <div class="sourcebar">
    <span><span id="countsText">正在统计来源…</span><span id="filterText"></span></span>
    <span class="srcbar-right"><button id="readAllBtn">✓ 全部已读</button><span>点击卡片查看原文 ↗</span></span>
  </div>
  <div class="srcnote" id="srcnote"></div>
  <main class="grid" id="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div>
    <div class="skel"></div><div class="skel"></div><div class="skel"></div></main>
  <footer>数据来自各站点公开 RSS · 本地服务每 15 分钟更新缓存 · 已读/收藏仅保存在本机浏览器（localStorage）· 快捷筛选仅做客户端筛选，不代表完整收录 · <a href="/api/stats" target="_blank" rel="noopener" style="color:inherit">服务状态</a></footer>
</div>
<script>
const $ = (s) => document.querySelector(s);
const grid = $("#grid"), note = $("#srcnote");
let DATA = null, q = "";
let ftype = localStorage.getItem("aihub_ftype") || "all";
let flang = localStorage.getItem("aihub_flang") || "all";
let quick = localStorage.getItem("aihub_quick") || "all";
let sourceSel = localStorage.getItem("aihub_fsource") || "all";

/* 已读 / 收藏：link -> 时间戳，超 3000 条按时间淘汰 */
function loadMap(k) { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch { return {}; } }
function saveMap(k, m) {
  const kept = Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 3000);
  try { localStorage.setItem(k, JSON.stringify(Object.fromEntries(kept))); } catch {}
}
let reads = loadMap("aihub_read");
let stars = loadMap("aihub_star");

/* NEW 角标基线 = 上次访问时间；首次访问不标（避免满屏 NEW） */
const NEW_BASELINE = Number(localStorage.getItem("aihub_lastvisit")) || Date.now();
localStorage.setItem("aihub_lastvisit", String(Date.now()));

/* 分页：每页 60 条，翻筛选时重置 */
const PAGE_STEP = 60;
let shownCount = PAGE_STEP;

const TYPE_INFO = {
  institution: { label: "官方机构", bg: "rgba(245,181,68,.14)", fg: "#f5c65b" },
  media:       { label: "官方媒体", bg: "rgba(61,214,140,.14)", fg: "#5fe3a1" },
  blogger:     { label: "博主 · UP主", bg: "rgba(154,107,255,.16)", fg: "#c3a1ff" }
};
const LANG_INFO = { cn: "中文", en: "English" };
const QUICK_LABEL = { all: "全部", recent: "最近24小时", tools: "工具 / 教程 / 工作流", models: "模型 / 发布 / 评测", star: "⭐ 收藏" };
function platformOf(s) {
  if (s.kind === "bilibili") return "B站视频";
  if (s.kind === "sohu") return "公众号镜像";
  if (String(s.url || "").includes("wechat2rss")) return "微信公众号";
  if (s.key === "simonw" || s.key === "ruanyifeng" || s.key === "baoyu") return "独立博客";
  return "RSS/官方博客";
}
function matchesQuick(r) {
  if (quick === "all") return true;
  if (quick === "star") return !!stars[r.link];
  if (quick === "recent") return r.ts > Date.now() - 24 * 60 * 60 * 1000;
  const text = (r.title + " " + (r.snippet || "")).toLowerCase();
  if (quick === "tools") return /工具|教程|工作流|提示词|agent|cursor|claude code|copilot|workflow|tutorial|prompt|coding|编程|实战|how to/.test(text);
  if (quick === "models") return /模型|发布|评测|基准|版本|gpt|gemini|claude|deepseek|llama|model|release|benchmark|openai|anthropic|google ai/.test(text);
  return true;
}

function ago(ts) {
  if (!ts) return "";
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return "刚刚";
  if (m < 60) return m + " 分钟前";
  const h = Math.floor(m / 60);
  if (h < 24) return h + " 小时前";
  const d = Math.floor(h / 24);
  if (d < 30) return d + " 天前";
  return new Date(ts).toLocaleDateString("zh-CN");
}

let lastShown = [], lastInfo = {};

function render() {
  if (!DATA) return;
  const infoOf = {};
  DATA.sources.forEach(s => { infoOf[s.key] = s; });
  const rows = [];
  for (const [key, f] of Object.entries(DATA.feeds)) {
    for (const it of f.items || []) {
      if (it.dupOf) continue; /* 同题聚合：非代表条目不重复展示 */
      rows.push({ ...it, src: key });
    }
  }
  rows.sort((a, b) => (b.ts || 0) - (a.ts || 0));
  const kw = q.trim().toLowerCase();
  const shown = rows.filter(r => {
    const s = infoOf[r.src] || {};
    return (ftype === "all" || s.type === ftype) &&
           (flang === "all" || s.lang === flang) &&
           (sourceSel === "all" || r.src === sourceSel) &&
           matchesQuick(r) &&
           (!kw || r.title.toLowerCase().includes(kw) || (r.snippet || "").toLowerCase().includes(kw));
  });
  lastShown = shown; lastInfo = infoOf;
  paintGrid(shown, infoOf);
  paintSummary(shown, infoOf);
}

function paintGrid(shown, infoOf) {
  grid.innerHTML = "";
  if (!shown.length) {
    grid.innerHTML = '<div class="empty">没有匹配的内容，换个关键词或稍后再试</div>';
    return;
  }
  const frag = document.createDocumentFragment();
  for (const r of shown.slice(0, shownCount)) {
    const s = infoOf[r.src] || {};
    const t = TYPE_INFO[s.type] || TYPE_INFO.media;
    const isRead = !!reads[r.link];
    const isNew = !isRead && r.ts > NEW_BASELINE;
    const a = document.createElement("a");
    a.className = "card" + (isRead ? " read" : "");
    a.href = r.link; a.target = "_blank"; a.rel = "noopener";
    a.innerHTML =
      '<span class="badges"><span class="badge" style="background:' + t.bg + ';color:' + t.fg + '">' +
        (s.name || r.src) + '</span>' + (isNew ? '<span class="newchip">NEW</span>' : "") + '</span>' +
      '<div class="cardbody"><div class="cardtext"><h3></h3>' +
      (r.snippet ? "<p></p>" : "") + '</div></div>' +
      '<div class="meta">' + t.label + " · " + platformOf(s) + " · " + (LANG_INFO[s.lang] || "") + " · " + (ago(r.ts) || "时间未知") + "</div>";
    a.querySelector("h3").textContent = r.title;
    if (r.snippet) a.querySelector("p").textContent = r.snippet;
    const star = document.createElement("button");
    star.type = "button";
    star.className = "star" + (stars[r.link] ? " on" : "");
    star.title = stars[r.link] ? "取消收藏" : "收藏";
    star.textContent = stars[r.link] ? "★" : "☆";
    a.appendChild(star);
    if (r.image) {
      const th = document.createElement("div");
      th.className = "thumb";
      const im = document.createElement("img");
      im.loading = "lazy";
      im.referrerPolicy = "no-referrer";
      im.alt = "";
      im.onerror = () => { th.remove(); };
      im.src = r.image;
      th.appendChild(im);
      a.querySelector(".cardbody").appendChild(th);
    }
    if (r.dupCount > 0) {
      const dw = document.createElement("div");
      dw.className = "dupwrap";
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "dupbtn";
      btn.textContent = "＋ 另有 " + r.dupCount + " 条相同报道";
      const list = document.createElement("div");
      list.className = "duplist";
      list.hidden = true;
      for (const d of r.dupes || []) {
        const item = document.createElement("span");
        item.className = "dupitem";
        const sName = document.createElement("span");
        sName.className = "dsrc";
        sName.textContent = (infoOf[d.src] || {}).name || d.src;
        item.appendChild(sName);
        item.appendChild(document.createTextNode(d.title));
        item.dataset.link = d.link;
        list.appendChild(item);
      }
      dw.appendChild(btn);
      dw.appendChild(list);
      a.appendChild(dw);
    }
    frag.appendChild(a);
  }
  if (shown.length > shownCount) {
    const more = document.createElement("button");
    more.type = "button";
    more.className = "loadmore";
    more.id = "loadMore";
    more.textContent = "加载更多（还有 " + (shown.length - shownCount) + " 条）";
    frag.appendChild(more);
  }
  grid.appendChild(frag);
}

function paintSummary(shown, infoOf) {
  const failed = Object.entries(DATA.feeds).filter(([, f]) => f.error);
  const labels = { institution: "🏢 官方机构", media: "📰 官方媒体", blogger: "✍ 博主 / UP主" };
  const unread = shown.reduce((n, r) => n + (reads[r.link] ? 0 : 1), 0);
  const uniqueSources = new Set(shown.map(r => r.src)).size;
  const countText = Object.keys(labels).map(type => {
    const n = DATA.sources.filter(s => s.type === type).length;
    return labels[type] + " " + n;
  }).join("　·　");
  const activeParts = [];
  if (ftype !== "all") activeParts.push(TYPE_INFO[ftype]?.label || ftype);
  if (flang !== "all") activeParts.push(LANG_INFO[flang] || flang);
  if (sourceSel !== "all") activeParts.push((infoOf[sourceSel] || {}).name || sourceSel);
  if (quick !== "all") activeParts.push(QUICK_LABEL[quick] || quick);
  if (q.trim()) activeParts.push("搜索：" + q.trim());
  const activeText = activeParts.length ? "　·　筛选：" + activeParts.join(" × ") : "";
  const shownText = shown.length > shownCount
    ? "已显示 <strong>" + shownCount + "</strong> / " + shown.length + " 条"
    : "当前显示 <strong>" + shown.length + "</strong> 条";
  $("#countsText").innerHTML = shownText + " · 未读 <strong>" + unread + "</strong> · <strong>" + uniqueSources + "</strong> 个来源　" + countText;
  $("#filterText").innerHTML = '<span style="color:#6f7890">' + activeText + "</span>";
  note.textContent = failed.length
    ? "⚠ 暂时抓取失败： " + failed.map(([k]) => (infoOf[k] || {}).name || k).join("、") + "（已跳过，其余正常）"
    : "";
}

function setStatus(cls, text) {
  $("#dot").className = "dot " + (cls || "");
  $("#statusText").textContent = text;
}

async function load(force) {
  $("#refresh").disabled = true;
  setStatus("", "抓取中…");
  try {
    const res = await fetch("/api/feeds" + (force ? "?force=1" : ""));
    DATA = await res.json();
    fillSources();
    render();
    const n = Object.values(DATA.feeds).reduce((s, f) => s + (f.items || []).length, 0);
    if (DATA.stale) {
      setStatus("stale", "已显示缓存 · 后台更新中");
      setTimeout(() => load(false), 10000);
    } else {
      setStatus("", "更新于 " + new Date(DATA.ts).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" }) + " · " + n + " 条");
    }
  } catch (e) {
    setStatus("err", "本地服务未响应，请重新双击桌面图标");
    grid.innerHTML = '<div class="empty">无法连接本地服务<br><br>请重新双击桌面的「AI 情报站」图标</div>';
  }
  $("#refresh").disabled = false;
}

function bindFilter(rowId, key, apply) {
  const row = $(rowId);
  row.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    localStorage.setItem(key, b.dataset.v);
    apply(b.dataset.v);
    row.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    render();
  });
  const saved = localStorage.getItem(key) || "all";
  const valid = [...row.querySelectorAll("button")].some(x => x.dataset.v === saved);
  const use = valid ? saved : "all";
  row.querySelectorAll("button").forEach(x => x.classList.toggle("on", x.dataset.v === use));
  return use;
}
function bindQuick() {
  $(".quick").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    quick = b.dataset.quick === "clear" ? "all" : b.dataset.quick;
    localStorage.setItem("aihub_quick", quick);
    shownCount = PAGE_STEP;
    document.querySelectorAll(".quick button").forEach(x => x.classList.toggle("on", x === b && quick !== "all"));
    render();
  });
  const saved = quick;
  document.querySelectorAll(".quick button").forEach(x => x.classList.toggle("on", x.dataset.quick === saved));
}

function fillSources() {
  const sel = $("#sourceSel");
  sel.innerHTML = '<option value="all">全部来源</option>';
  for (const s of [...DATA.sources].sort((a, b) => String(a.name || a.key).localeCompare(String(b.name || b.key), "zh-CN"))) {
    const o = document.createElement("option");
    o.value = s.key;
    o.textContent = s.name || s.key;
    sel.appendChild(o);
  }
  if (![...sel.options].some(o => o.value === sourceSel)) sourceSel = "all";
  sel.value = sourceSel;
}

/* 卡片区域统一事件委托：加载更多 / 星标 / 点击标记已读 */
grid.addEventListener("click", (e) => {
  const dupbtn = e.target.closest(".dupbtn");
  if (dupbtn) {
    e.preventDefault();
    const list = dupbtn.parentElement.querySelector(".duplist");
    list.hidden = !list.hidden;
    const n = list.querySelectorAll(".dupitem").length;
    dupbtn.textContent = list.hidden ? "＋ 另有 " + n + " 条相同报道" : "－ 收起相同报道";
    return;
  }
  const dupitem = e.target.closest(".dupitem");
  if (dupitem) {
    e.preventDefault();
    window.open(dupitem.dataset.link, "_blank", "noopener");
    return;
  }
  if (e.target.closest("#loadMore")) {
    shownCount += PAGE_STEP;
    render();
    return;
  }
  const star = e.target.closest(".star");
  if (star) {
    e.preventDefault();
    const link = star.closest("a.card").getAttribute("href");
    if (stars[link]) delete stars[link]; else stars[link] = Date.now();
    saveMap("aihub_star", stars);
    const on = !!stars[link];
    star.classList.toggle("on", on);
    star.textContent = on ? "★" : "☆";
    star.title = on ? "取消收藏" : "收藏";
    if (quick === "star") render();
    return;
  }
  const card = e.target.closest("a.card");
  if (card && !card.classList.contains("read")) {
    const link = card.getAttribute("href");
    reads[link] = Date.now();
    saveMap("aihub_read", reads);
    card.classList.add("read");
    const chip = card.querySelector(".newchip");
    if (chip) chip.remove();
    paintSummary(lastShown, lastInfo);
  }
});

$("#readAllBtn").addEventListener("click", () => {
  const now = Date.now();
  for (const r of lastShown) reads[r.link] = now;
  saveMap("aihub_read", reads);
  render();
});

$("#sourceSel").addEventListener("change", (e) => {
  sourceSel = e.target.value;
  localStorage.setItem("aihub_fsource", sourceSel);
  shownCount = PAGE_STEP;
  render();
});

ftype = bindFilter("#typeRow", "aihub_ftype", (v) => { ftype = v; shownCount = PAGE_STEP; });
flang = bindFilter("#langRow", "aihub_flang", (v) => { flang = v; shownCount = PAGE_STEP; });
bindQuick();
$("#search").addEventListener("input", (e) => { q = e.target.value; shownCount = PAGE_STEP; render(); });
$("#refresh").addEventListener("click", () => load(true));

load(false);
setInterval(() => load(false), 10 * 60 * 1000);
</script>
</body>
</html>
