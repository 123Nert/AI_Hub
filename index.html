<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 情报站</title>
<style>
  :root {
    --bg: #0d1017; --bg2: #131722; --card: #1a2030; --card-hover: #202841;
    --line: #263048; --text: #e8ecf5; --muted: #8b94ab; --accent: #5b8cff; --accent2: #9a6bff;
    --official: #46d795; --blogger: #a674ff; --lab: #f5b544;
    --meta: #5f6880; --faint: #454e63; --staridle: #39415a; --hoverline: #35426a;
  }
  html[data-theme="light"] {
    --bg: #f4f6fb; --bg2: #eaedf6; --card: #ffffff; --card-hover: #f3f5ff;
    --line: #dfe3ee; --text: #232941; --muted: #67708d;
    --meta: #8a92a6; --faint: #b8bfd0; --staridle: #c3cad9; --hoverline: #b9c6ee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* hidden 属性优先级必须高于各类 display:flex 规则，否则弹层/表单会常显 */
  [hidden] { display: none !important; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 20px 24px 60px; }

  header { display: flex; align-items: center; gap: 16px; padding: 8px 0 20px; flex-wrap: wrap; }
  .logo { font-size: 22px; font-weight: 700; letter-spacing: 1px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent; white-space: nowrap; }
  .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #3dd68c; }
  .dot.stale { background: #f5b544; }
  .dot.err { background: #ff5b5b; }
  .spacer { flex: 1; }
  #search {
    background: var(--card); border: 1px solid var(--line); color: var(--text);
    padding: 8px 14px; border-radius: 10px; width: 240px; font-size: 13px; outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #refresh {
    background: linear-gradient(90deg, var(--accent), var(--accent2)); border: none; color: #fff;
    padding: 8px 18px; border-radius: 10px; font-size: 13px; cursor: pointer; font-weight: 600;
  }
  #refresh:disabled { opacity: .5; cursor: wait; }

  .filterrow { display: flex; align-items: center; gap: 8px; padding-bottom: 10px; flex-wrap: wrap; }
  .flabel { font-size: 12px; color: var(--muted); width: 52px; text-align: right; flex-shrink: 0; }
  nav button, .frow button {
    background: var(--bg2); color: var(--muted); border: 1px solid var(--line);
    padding: 6px 14px; border-radius: 999px; font-size: 13px; cursor: pointer; transition: .15s;
  }
  nav button:hover, .frow button:hover { color: var(--text); }
  nav button.on, .frow button.on { background: linear-gradient(90deg, rgba(91,140,255,.18), rgba(154,107,255,.18));
    border-color: var(--accent); color: #cfe0ff; }
  #typeRow button[data-v="institution"].on { border-color: var(--lab); color: #ffda88; }
  .quick { display: flex; gap: 8px; align-items: center; margin: 2px 0 16px; flex-wrap: wrap; }
  .quick-label { font-size: 12px; color: var(--muted); }
  .quick button { background: rgba(245,181,68,.08); color: #e4bb69; border: 1px solid rgba(245,181,68,.28);
    padding: 5px 11px; border-radius: 999px; cursor: pointer; font-size: 12px; }
  .quick button:hover, .quick button.on { background: rgba(245,181,68,.2); color: #ffda88; }
  .sourcebar { display: flex; justify-content: space-between; align-items: center; color: var(--muted);
    font-size: 12px; padding: 1px 0 14px; }
  .sourcebar strong { color: var(--text); font-weight: 600; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 18px; display: flex; flex-direction: column; gap: 8px;
    transition: .15s; text-decoration: none; color: inherit; position: relative;
  }
  .card:hover { background: var(--card-hover); border-color: var(--hoverline); transform: translateY(-2px); }
  .card.read { opacity: .5; }
  .card.read:hover { opacity: .9; }
  .badges { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding-right: 26px; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
  .newchip { font-size: 10px; font-weight: 800; letter-spacing: .5px; padding: 1px 7px;
    border-radius: 999px; background: #ff5b5b; color: #fff; }
  .star { position: absolute; top: 8px; right: 10px; background: none; border: none;
    cursor: pointer; font-size: 17px; line-height: 1; color: var(--staridle); padding: 4px; z-index: 1; }
  .star:hover { color: #8b94ab; }
  .star.on { color: #f5b544; }
  .cardbody { display: flex; gap: 12px; }
  .cardtext { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .thumb { flex-shrink: 0; width: 92px; height: 92px; border-radius: 10px; overflow: hidden; background: var(--bg2); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card h3 { font-size: 15px; line-height: 1.45; font-weight: 600; }
  .card p { font-size: 12.5px; color: var(--muted); line-height: 1.6;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { font-size: 11.5px; color: var(--meta); margin-top: auto; padding-top: 4px; }
  .loadmore { grid-column: 1 / -1; background: var(--bg2); border: 1px dashed var(--line);
    color: var(--muted); border-radius: 14px; padding: 14px; font-size: 13px; cursor: pointer; }
  .loadmore:hover { color: var(--text); border-color: var(--accent); }
  #sourceSel { background: var(--card); border: 1px solid var(--line); color: var(--text);
    padding: 5px 12px; border-radius: 999px; font-size: 13px; outline: none; max-width: 320px; cursor: pointer; }
  #sourceSel:focus { border-color: var(--accent); }
  .srcbar-right { display: flex; align-items: center; gap: 12px; }
  #readAllBtn, #exportMd, #exportJson { background: none; border: 1px solid var(--line); color: var(--muted);
    padding: 3px 11px; border-radius: 999px; font-size: 12px; cursor: pointer; }
  #readAllBtn:hover, #exportMd:hover, #exportJson:hover { color: var(--text); border-color: var(--accent); }

  .dupbtn { background: none; border: none; color: var(--accent); font-size: 11.5px; cursor: pointer; padding: 0; text-align: left; }
  .dupbtn:hover { text-decoration: underline; }
  .duplist { font-size: 11.5px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 9px; display: flex; flex-direction: column; gap: 4px; margin-top: 2px; }
  .dupitem { cursor: pointer; line-height: 1.5; }
  .dupitem:hover { color: var(--text); }
  .dupitem .dsrc { color: var(--accent); font-weight: 600; margin-right: 4px; }

  .skel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; height: 120px; position: relative; overflow: hidden; }
  .skel::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.05), transparent);
    animation: sweep 1.2s infinite; }
  @keyframes sweep { from { transform: translateX(-100%);} to { transform: translateX(100%);} }

  .empty { text-align: center; color: var(--muted); padding: 80px 0; font-size: 14px; }
  .srcnote { font-size: 12px; color: #f5b544; padding: 0 0 14px; }
  footer { margin-top: 40px; text-align: center; color: var(--faint); font-size: 12px; }
  .iconbtn { background: var(--bg2); border: 1px solid var(--line); color: var(--muted);
    padding: 8px 13px; border-radius: 10px; font-size: 13px; cursor: pointer; text-decoration: none; }
  .iconbtn:hover { color: var(--text); border-color: var(--accent); }
  .topicform { background: var(--bg2); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; margin: 0 0 14px; display: flex; gap: 8px; flex-wrap: wrap;
    align-items: center; font-size: 12.5px; color: var(--muted); }
  .topicform input, .topicform textarea { background: var(--card); border: 1px solid var(--line);
    color: var(--text); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; outline: none;
    font-family: inherit; }
  .topicform input:focus, .topicform textarea:focus { border-color: var(--accent); }
  .topicform button { background: var(--card); border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 12.5px; }
  .topicform button:hover { border-color: var(--accent); }
  .delchip { background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 4px 2px 10px; font-size: 12px; color: var(--text);
    display: inline-flex; align-items: center; gap: 4px; }
  .delchip button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; }
  .delchip button:hover { color: #ff5b5b; }
  .hotrow { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 0 0 14px;
    font-size: 12px; color: var(--muted); }
  .hotword { background: rgba(154,107,255,.10); color: #a88dff; border: 1px solid rgba(154,107,255,.3);
    border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
  .hotword:hover { background: rgba(154,107,255,.22); color: #c9b2ff; }
  .trendsec { background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 0 0 16px; }
  .trendhead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .trendhead b { font-size: 14px; }
  #trendMeta { color: var(--muted); font-size: 12px; }
  #trendToggle { margin-left: auto; background: var(--card); border: 1px solid var(--line); color: var(--muted);
    border-radius: 999px; padding: 2px 11px; font-size: 12px; cursor: pointer; }
  #trendToggle:hover { color: var(--text); border-color: var(--accent); }
  .trendgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 8px; }
  .trendrow { display: flex; flex-direction: column; gap: 3px; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 12px; text-decoration: none; color: inherit; transition: .15s; }
  .trendrow:hover { background: var(--card-hover); border-color: var(--hoverline); }
  .trendline1 { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .trendrank { font-weight: 800; color: var(--accent); font-size: 13px; }
  .trendname { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trendstars { margin-left: auto; color: #f5b544; font-size: 12px; white-space: nowrap; }
  .trenddesc { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trendlang { font-size: 11.5px; color: var(--meta); }
  html[data-theme="light"] .trendstars { color: #9a6b12; }
  .modal-mask { position: fixed; inset: 0; background: rgba(8,10,18,.62); display: flex;
    align-items: center; justify-content: center; z-index: 50; }
  .modal { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    max-width: 660px; width: 92%; max-height: 82vh; overflow: auto; padding: 18px 20px; }
  .srcrow { display: flex; align-items: center; gap: 10px; padding: 7px 0;
    border-bottom: 1px solid var(--line); font-size: 13px; flex-wrap: wrap; }
  .srcrow .ok { color: #3dd68c; } .srcrow .warn { color: #f5b544; } .srcrow .err { color: #ff5b5b; }
  .srcrow .errline { color: var(--muted); font-size: 12px; width: 100%; padding-left: 22px; }
  html[data-theme="light"] .quick button { background: rgba(245,181,68,.14); color: #9a6b12; border-color: rgba(245,181,68,.5); }
  html[data-theme="light"] .quick button:hover, html[data-theme="light"] .quick button.on { background: rgba(245,181,68,.24); color: #7a5410; }
  html[data-theme="light"] .hotword { color: #7c5cd6; }
  html[data-theme="light"] .skel::after { background: linear-gradient(90deg, transparent, rgba(0,0,0,.05), transparent); }
  html[data-theme="light"] nav button.on, html[data-theme="light"] .frow button.on {
    background: linear-gradient(90deg, rgba(91,140,255,.14), rgba(154,107,255,.14)); color: #2f56c4; }
  html[data-theme="light"] #typeRow button[data-v="institution"].on { color: #9a6b12; }
  html[data-theme="light"] .srcnote { color: #9a6b12; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🤖 AI 情报站</div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">加载中…</span></div>
    <div class="spacer"></div>
    <input id="search" type="search" placeholder="搜索标题 / 摘要…">
    <button class="iconbtn" id="filterToggle" title="显示 / 隐藏筛选区">⚙ 筛选</button>
    <a class="iconbtn" href="/digest" target="_blank" title="最近 24 小时简报，可直接打印">📰 简报</a>
    <button class="iconbtn" id="statsBtn" title="各信息源抓取健康状态">📊 源状态</button>
    <button class="iconbtn" id="themeBtn" title="主题">🌓</button>
    <button id="refresh">刷新</button>
  </header>
  <div id="filterArea">
  <nav id="typeRow" class="filterrow">
    <span class="flabel">类型</span>
    <button data-v="all" class="on">全部</button>
    <button data-v="institution">🏢 官方机构</button>
    <button data-v="media">📰 官方媒体</button>
    <button data-v="blogger">✍ 博主 · UP主</button>
    <button data-v="community">👥 社区</button>
    <button data-v="paper">📄 论文</button>
    <button data-v="repo">📦 新仓库</button>
  </nav>
  <nav id="langRow" class="filterrow">
    <span class="flabel">语言</span>
    <button data-v="all" class="on">全部</button>
    <button data-v="cn">中文</button>
    <button data-v="en">English</button>
  </nav>
  <nav id="topicRow" class="filterrow">
    <span class="flabel">主题</span>
    <button data-v="all" class="on">全部</button>
    <button id="topicManage" title="添加 / 删除自定义主题">＋ 管理</button>
  </nav>
  <div id="topicForm" class="topicform" hidden>
    <input id="topicName" placeholder="主题名，如 端侧部署" style="width:150px">
    <input id="topicRx" placeholder="命中正则，如 端侧|on-device|ollama|gguf" style="flex:1;min-width:220px">
    <button id="topicSave">保存主题</button>
    <span id="topicList" style="display:flex;gap:6px;flex-wrap:wrap"></span>
  </div>
  <nav id="srcRow" class="filterrow">
    <span class="flabel">来源</span>
    <select id="sourceSel"><option value="all">全部来源</option></select>
  </nav>
  <div class="quick">
    <span class="quick-label">快捷视图</span>
    <button data-quick="recent">⚡ 最近 24 小时</button>
    <button data-quick="tools">🧰 工具 / 教程 / 工作流</button>
    <button data-quick="models">🧠 模型 / 发布 / 评测</button>
    <button data-quick="star">⭐ 收藏</button>
    <button data-quick="clear">清除快捷筛选</button>
    <button id="muteBtn" title="按正则规则隐藏不感兴趣的内容">🔇 屏蔽</button>
  </div>
  <div id="mutePanel" class="topicform" hidden>
    <label style="display:flex;align-items:center;gap:5px"><input type="checkbox" id="muteOn"> 启用屏蔽</label>
    <textarea id="muteRules" rows="3" placeholder="每行一条正则，命中标题或摘要即隐藏。例：招聘|软文|广告" style="flex:1;min-width:260px"></textarea>
    <button id="muteSave">保存</button>
    <span style="color:var(--muted)">规则保存在本机浏览器。</span>
  </div>
  <div class="hotrow" id="hotRow" hidden></div>
  </div>
  <div class="sourcebar">
    <span><span id="countsText">正在统计来源…</span><span id="filterText"></span></span>
    <span class="srcbar-right"><button id="exportMd" title="导出当前筛选结果为 Markdown">⬇ MD</button><button id="exportJson" title="导出当前筛选结果为 JSON">⬇ JSON</button><button id="readAllBtn">✓ 全部已读</button><span>点击卡片查看原文 ↗</span></span>
  </div>
  <div class="srcnote" id="srcnote"></div>
  <nav id="secRow" class="filterrow">
    <span class="flabel">板块</span>
    <button data-sec="feed" class="on">🤖 AI 资讯</button>
    <button data-sec="phones">📱 手机上新</button>
    <button data-sec="trend">🔥 GitHub 周榜</button>
  </nav>
  <section id="trendSec" class="trendsec" hidden>
    <div class="trendhead">
      <b>🔥 GitHub 周热榜 · Top 10</b>
      <span id="trendMeta"></span>
      <button id="trendToggle" title="收起 / 展开周热榜">收起</button>
    </div>
    <div id="trendGrid" class="trendgrid"><div class="empty" style="padding:16px 0;font-size:12.5px">加载中…</div></div>
  </section>
  <main class="grid" id="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div>
    <div class="skel"></div><div class="skel"></div><div class="skel"></div></main>
  <footer>数据来自各站点公开 RSS · 本地服务每 15 分钟更新缓存 · 已读/收藏仅保存在本机浏览器（localStorage）· 快捷筛选仅做客户端筛选，不代表完整收录 · <a href="/api/stats" target="_blank" rel="noopener" style="color:inherit">服务状态</a></footer>
</div>
<div class="modal-mask" id="statsMask" hidden>
  <div class="modal">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <b>📊 源健康状态</b>
      <button class="iconbtn" id="statsClose">✕</button>
    </div>
    <div id="statsMeta" style="font-size:12px;color:var(--muted);margin-bottom:8px"></div>
    <div id="statsBody"></div>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const grid = $("#grid"), note = $("#srcnote");
let DATA = null, q = "";
let ftype = localStorage.getItem("aihub_ftype") || "all";
let flang = localStorage.getItem("aihub_flang") || "all";
let quick = localStorage.getItem("aihub_quick") || "all";
if (quick === "phones") { quick = "all"; localStorage.setItem("aihub_quick", "all"); } /* 手机上新已升级为板块导航 */
let sourceSel = localStorage.getItem("aihub_fsource") || "all";
let theme = localStorage.getItem("aihub_theme") || "auto";
let stopic = localStorage.getItem("aihub_ftopic") || "all";
let customs = (() => { try { return JSON.parse(localStorage.getItem("aihub_topics")) || []; } catch { return []; } })();
let MUTE = (() => {
  try { const m = JSON.parse(localStorage.getItem("aihub_mute")); return (m && typeof m.on === "boolean" && Array.isArray(m.rules)) ? m : { on: false, rules: [] }; }
  catch { return { on: false, rules: [] }; }
})();
let sec = localStorage.getItem("aihub_sec") || "feed";
if (!["feed", "phones", "trend"].includes(sec)) sec = "feed";

/* 已读 / 收藏：link -> 时间戳，超 3000 条按时间淘汰 */
function loadMap(k) { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch { return {}; } }
function saveMap(k, m) {
  const kept = Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 3000);
  try { localStorage.setItem(k, JSON.stringify(Object.fromEntries(kept))); } catch {}
}
let reads = loadMap("aihub_read");
let stars = loadMap("aihub_star");

/* NEW 角标基线 = 上次访问时间；首次访问不标（避免满屏 NEW） */
const NEW_BASELINE = Number(localStorage.getItem("aihub_lastvisit")) || Date.now();
localStorage.setItem("aihub_lastvisit", String(Date.now()));

/* 分页：每页 60 条，翻筛选时重置 */
const PAGE_STEP = 60;
let shownCount = PAGE_STEP;

const TYPE_INFO = {
  institution: { label: "官方机构", bg: "rgba(245,181,68,.14)", fg: "#f5c65b", bgL: "rgba(180,110,10,.12)", fgL: "#8a5a06" },
  media:       { label: "官方媒体", bg: "rgba(61,214,140,.14)", fg: "#5fe3a1", bgL: "rgba(16,140,90,.12)", fgL: "#0d7a4e" },
  blogger:     { label: "博主 · UP主", bg: "rgba(154,107,255,.16)", fg: "#c3a1ff", bgL: "rgba(110,70,220,.12)", fgL: "#5b3cb5" },
  community:   { label: "社区", bg: "rgba(91,140,255,.16)", fg: "#8fb0ff", bgL: "rgba(50,90,220,.12)", fgL: "#2f56c4" },
  paper:       { label: "论文", bg: "rgba(64,190,190,.16)", fg: "#6fd8d8", bgL: "rgba(10,130,130,.12)", fgL: "#0c6f6f" },
  repo:        { label: "新仓库", bg: "rgba(235,240,250,.14)", fg: "#c9d2e8", bgL: "rgba(70,90,140,.10)", fgL: "#47598c" }
};
const LANG_INFO = { cn: "中文", en: "English" };
const QUICK_LABEL = { all: "全部", recent: "最近24小时", tools: "工具 / 教程 / 工作流", models: "模型 / 发布 / 评测", star: "⭐ 收藏" };
function platformOf(s) {
  if (s.kind === "bilibili") return "B站视频";
  if (s.kind === "gh") return "GitHub";
  if (s.kind === "sohu") return "公众号镜像";
  if (String(s.url || "").includes("arxiv.org")) return "arXiv";
  if (String(s.url || "").includes("reddit.com")) return "Reddit";
  if (String(s.url || "").includes("wechat2rss")) return "微信公众号";
  if (s.key === "simonw" || s.key === "ruanyifeng" || s.key === "baoyu") return "独立博客";
  return "RSS/官方博客";
}
function matchesQuick(r) {
  if (quick === "all") return true;
  if (quick === "star") return !!stars[r.link];
  if (quick === "recent") return r.ts > Date.now() - 24 * 60 * 60 * 1000;
  const text = (r.title + " " + (r.snippet || "")).toLowerCase();
  if (quick === "tools") return /工具|教程|工作流|提示词|agent|cursor|claude code|copilot|workflow|tutorial|prompt|coding|编程|实战|how to/.test(text);
  if (quick === "models") return /模型|发布|评测|基准|版本|gpt|gemini|claude|deepseek|llama|model|release|benchmark|openai|anthropic|google ai/.test(text);
  return true;
}

/* 主题订阅：预设 + 自定义（localStorage），按正则命中标题/摘要 */
const TOPIC_PRESETS = [
  { id: "p_agent", name: "🤖 Agent", rx: "agent|智能体|agentic|copilot|claude code|computer use|多智能体" },
  { id: "p_gen", name: "🎬 生成式", rx: "视频生成|文生视频|图像生成|多模态|语音|sora|veo|可灵|即梦|runway|pika|midjourney|diffusion" },
  { id: "p_model", name: "🧠 大模型", rx: "llm|大模型|deepseek|llama|qwen|通义|kimi|glm|mistral|gemini|claude|gpt-|o1|o3|端侧|开源|benchmark|评测|微调|finetune|rlhf" },
  { id: "p_robot", name: "🦾 具身智能", rx: "机器人|具身|humanoid|robot|自动驾驶|self-driving|芯片|算力|gpu|nvidia" },
  { id: "p_prod", name: "🛠 产品工具", rx: "工具|产品|工作流|workflow|cursor|ide|插件|实战|教程|提示词|prompt|mcp" }
];
function allTopics() { return TOPIC_PRESETS.concat(customs); }
function matchesTopic(r) {
  if (stopic === "all") return true;
  const t = allTopics().find(x => x.id === stopic);
  if (!t) return true;
  try { return new RegExp(t.rx, "i").test(r.title + " " + (r.snippet || "")); }
  catch { return true; }
}
/* 关键词屏蔽：正则列表，命中标题或摘要即隐藏 */
function compileMutes() {
  if (!MUTE.on) return [];
  return (MUTE.rules || []).map(rx => { try { return new RegExp(rx, "i"); } catch { return null; } }).filter(Boolean);
}
/* 手机上新匹配：板块筛选共用 */
const PHONE_RX = /(手机|iphone|苹果|华为|小米|xiaomi|redmi|oppo|vivo|一加|oneplus|荣耀|honor|三星|galaxy|pixel|realme|真我|iqoo|努比亚|魅族|meizu|折叠屏|旗舰|骁龙|天玑|麒麟|快充|开售|首销|发布会|上新)/i;
function isPhoneRow(r) { return PHONE_RX.test(String(r.title || "") + " " + String(r.snippet || "")); }
/* 7 日热词：标题分词（英文整词 + 中文 bigram），点击即搜索 */
const HOT_STOP = new Set(["the","and","for","with","from","that","this","are","was","were","has","have","new","how","why","what","you","your","can","will","all","get","out","about","into","more","not","but","just","now","via","using","use","to","of","in","on","is","it","at","as","be","by","an","or","up","vs","if","do","no","so","we","my","的","了","在","是","和","与","及","对","从","到","被","把","一个","这个","那个","我们","他们","怎么","如何","为什么","什么","可以","已经","进行","发布","推出","宣布","官宣","上线","带来","独家","汇总","盘点"]);
function hotTokens(t) {
  const s = String(t || "").normalize("NFKC").toLowerCase();
  const toks = [];
  for (const m of s.match(/[a-z0-9]+/g) || []) if (m.length >= 2) toks.push(m);
  const cjk = s.match(/[\u4e00-\u9fff]/g) || [];
  for (let i = 0; i + 1 < cjk.length; i++) toks.push(cjk[i] + cjk[i + 1]);
  return toks;
}
function paintHotwords(rows) {
  const row = $("#hotRow");
  if (!row) return;
  const since = Date.now() - 7 * 24 * 60 * 60 * 1000;
  const freq = {};
  for (const r of rows) {
    if (!r.ts || r.ts < since) continue;
    const seen = new Set();
    for (const t of hotTokens(r.title)) {
      if (seen.has(t) || HOT_STOP.has(t) || /^\d+$/.test(t)) continue;
      seen.add(t);
      freq[t] = (freq[t] || 0) + 1;
    }
  }
  const top = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 12);
  if (!top.length) { row.hidden = true; return; }
  row.hidden = false;
  row.innerHTML = "";
  const lab = document.createElement("span");
  lab.textContent = "🔥 7 日热词";
  row.appendChild(lab);
  for (const [w, n] of top) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "hotword";
    b.textContent = w + " " + n;
    b.addEventListener("click", () => { q = w; $("#search").value = w; shownCount = PAGE_STEP; render(); });
    row.appendChild(b);
  }
}

function ago(ts) {
  if (!ts) return "";
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return "刚刚";
  if (m < 60) return m + " 分钟前";
  const h = Math.floor(m / 60);
  if (h < 24) return h + " 小时前";
  const d = Math.floor(h / 24);
  if (d < 30) return d + " 天前";
  return new Date(ts).toLocaleDateString("zh-CN");
}

let lastShown = [], lastInfo = {}, mutedNow = 0;

function render() {
  if (!DATA) return;
  const infoOf = {};
  DATA.sources.forEach(s => { infoOf[s.key] = s; });
  const rows = [];
  for (const [key, f] of Object.entries(DATA.feeds)) {
    for (const it of f.items || []) {
      if (it.dupOf) continue; /* 同题聚合：非代表条目不重复展示 */
      rows.push({ ...it, src: key });
    }
  }
  rows.sort((a, b) => (b.ts || 0) - (a.ts || 0));
  const kw = q.trim().toLowerCase();
  const mutes = compileMutes();
  let mutedCount = 0;
  const base = rows.filter(r => {
    const s = infoOf[r.src] || {};
    if (!((ftype === "all" || s.type === ftype) &&
          (flang === "all" || s.lang === flang) &&
          (sourceSel === "all" || r.src === sourceSel))) return false;
    if (!matchesTopic(r)) return false;
    if (mutes.length && mutes.some(rx => rx.test(r.title + " " + (r.snippet || "")))) { mutedCount++; return false; }
    return true;
  });
  paintHotwords(base);
  mutedNow = mutedCount;
  const shown = base.filter(r =>
    (sec !== "phones" || isPhoneRow(r)) &&
    matchesQuick(r) &&
    (!kw || r.title.toLowerCase().includes(kw) || (r.snippet || "").toLowerCase().includes(kw)));
  lastShown = shown; lastInfo = infoOf;
  paintGrid(shown, infoOf);
  paintSummary(shown, infoOf);
  applySecVisibility();
}

function paintGrid(shown, infoOf) {
  grid.innerHTML = "";
  if (!shown.length) {
    grid.innerHTML = '<div class="empty">没有匹配的内容，换个关键词或稍后再试</div>';
    return;
  }
  const frag = document.createDocumentFragment();
  for (const r of shown.slice(0, shownCount)) {
    const s = infoOf[r.src] || {};
    const t = TYPE_INFO[s.type] || TYPE_INFO.media;
    const light = document.documentElement.dataset.theme === "light";
    const tbg = light ? (t.bgL || t.bg) : t.bg, tfg = light ? (t.fgL || t.fg) : t.fg;
    const isRead = !!reads[r.link];
    const isNew = !isRead && r.ts > NEW_BASELINE;
    const a = document.createElement("a");
    a.className = "card" + (isRead ? " read" : "");
    a.href = r.link; a.target = "_blank"; a.rel = "noopener";
    a.innerHTML =
      '<span class="badges"><span class="badge" style="background:' + tbg + ';color:' + tfg + '">' +
        (s.name || r.src) + '</span>' + (isNew ? '<span class="newchip">NEW</span>' : "") + '</span>' +
      '<div class="cardbody"><div class="cardtext"><h3></h3>' +
      (r.snippet ? "<p></p>" : "") + '</div></div>' +
      '<div class="meta">' + t.label + " · " + platformOf(s) + " · " + (LANG_INFO[s.lang] || "") + " · " + (ago(r.ts) || "时间未知") + "</div>";
    a.querySelector("h3").textContent = r.title;
    if (r.snippet) a.querySelector("p").textContent = r.snippet;
    const star = document.createElement("button");
    star.type = "button";
    star.className = "star" + (stars[r.link] ? " on" : "");
    star.title = stars[r.link] ? "取消收藏" : "收藏";
    star.textContent = stars[r.link] ? "★" : "☆";
    a.appendChild(star);
    if (r.image) {
      const th = document.createElement("div");
      th.className = "thumb";
      const im = document.createElement("img");
      im.loading = "lazy";
      im.referrerPolicy = "no-referrer";
      im.alt = "";
      im.onerror = () => { th.remove(); };
      im.src = r.image;
      th.appendChild(im);
      a.querySelector(".cardbody").appendChild(th);
    }
    if (r.dupCount > 0) {
      const dw = document.createElement("div");
      dw.className = "dupwrap";
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "dupbtn";
      btn.textContent = "＋ 另有 " + r.dupCount + " 条相同报道";
      const list = document.createElement("div");
      list.className = "duplist";
      list.hidden = true;
      for (const d of r.dupes || []) {
        const item = document.createElement("span");
        item.className = "dupitem";
        const sName = document.createElement("span");
        sName.className = "dsrc";
        sName.textContent = (infoOf[d.src] || {}).name || d.src;
        item.appendChild(sName);
        item.appendChild(document.createTextNode(d.title));
        item.dataset.link = d.link;
        list.appendChild(item);
      }
      dw.appendChild(btn);
      dw.appendChild(list);
      a.appendChild(dw);
    }
    frag.appendChild(a);
  }
  if (shown.length > shownCount) {
    const more = document.createElement("button");
    more.type = "button";
    more.className = "loadmore";
    more.id = "loadMore";
    more.textContent = "加载更多（还有 " + (shown.length - shownCount) + " 条）";
    frag.appendChild(more);
  }
  grid.appendChild(frag);
}

function paintSummary(shown, infoOf) {
  const failed = Object.entries(DATA.feeds).filter(([, f]) => f.error);
  const labels = { institution: "🏢 官方机构", media: "📰 官方媒体", community: "👥 社区", blogger: "✍ 博主 / UP主", paper: "📄 论文", repo: "📦 仓库" };
  const unread = shown.reduce((n, r) => n + (reads[r.link] ? 0 : 1), 0);
  const uniqueSources = new Set(shown.map(r => r.src)).size;
  const countText = Object.keys(labels).map(type => {
    const n = DATA.sources.filter(s => s.type === type).length;
    return labels[type] + " " + n;
  }).join("　·　");
  const activeParts = [];
  if (ftype !== "all") activeParts.push(TYPE_INFO[ftype]?.label || ftype);
  if (flang !== "all") activeParts.push(LANG_INFO[flang] || flang);
  if (sourceSel !== "all") activeParts.push((infoOf[sourceSel] || {}).name || sourceSel);
  if (stopic !== "all") activeParts.push((allTopics().find(t => t.id === stopic) || {}).name || stopic);
  if (sec === "phones") activeParts.push("📱 手机上新板块");
  if (quick !== "all") activeParts.push(QUICK_LABEL[quick] || quick);
  if (MUTE.on) activeParts.push("🔇 屏蔽" + (mutedNow ? " × " + mutedNow : ""));
  if (q.trim()) activeParts.push("搜索：" + q.trim());
  const activeText = activeParts.length ? "　·　筛选：" + activeParts.join(" × ") : "";
  const shownText = shown.length > shownCount
    ? "已显示 <strong>" + shownCount + "</strong> / " + shown.length + " 条"
    : "当前显示 <strong>" + shown.length + "</strong> 条";
  $("#countsText").innerHTML = shownText + " · 未读 <strong>" + unread + "</strong> · <strong>" + uniqueSources + "</strong> 个来源　" + countText;
  $("#filterText").innerHTML = '<span style="color:#6f7890">' + activeText + "</span>";
  note.textContent = failed.length
    ? "⚠ 暂时抓取失败： " + failed.map(([k]) => (infoOf[k] || {}).name || k).join("、") + "（已跳过，其余正常）"
    : "";
}

function setStatus(cls, text) {
  $("#dot").className = "dot " + (cls || "");
  $("#statusText").textContent = text;
}

async function load(force) {
  $("#refresh").disabled = true;
  setStatus("", "抓取中…");
  try {
    const res = await fetch("/api/feeds" + (force ? "?force=1" : ""));
    DATA = await res.json();
    fillSources();
    render();
    const n = Object.values(DATA.feeds).reduce((s, f) => s + (f.items || []).length, 0);
    if (DATA.stale) {
      setStatus("stale", "已显示缓存 · 后台更新中");
      setTimeout(() => load(false), 10000);
    } else {
      setStatus("", "更新于 " + new Date(DATA.ts).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" }) + " · " + n + " 条");
    }
  } catch (e) {
    setStatus("err", "本地服务未响应，请重新双击桌面图标");
    grid.innerHTML = '<div class="empty">无法连接本地服务<br><br>请重新双击桌面的「AI 情报站」图标</div>';
  }
  $("#refresh").disabled = false;
}

function bindFilter(rowId, key, apply) {
  const row = $(rowId);
  row.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    localStorage.setItem(key, b.dataset.v);
    apply(b.dataset.v);
    row.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    render();
  });
  const saved = localStorage.getItem(key) || "all";
  const valid = [...row.querySelectorAll("button")].some(x => x.dataset.v === saved);
  const use = valid ? saved : "all";
  row.querySelectorAll("button").forEach(x => x.classList.toggle("on", x.dataset.v === use));
  return use;
}
function bindQuick() {
  $(".quick").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || b.id === "muteBtn") return;
    quick = b.dataset.quick === "clear" ? "all" : b.dataset.quick;
    localStorage.setItem("aihub_quick", quick);
    shownCount = PAGE_STEP;
    document.querySelectorAll(".quick button").forEach(x => x.classList.toggle("on", x === b && quick !== "all"));
    render();
  });
  const saved = quick;
  document.querySelectorAll(".quick button[data-quick]").forEach(x => x.classList.toggle("on", x.dataset.quick === saved));
}

function fillSources() {
  const sel = $("#sourceSel");
  sel.innerHTML = '<option value="all">全部来源</option>';
  for (const s of [...DATA.sources].sort((a, b) => String(a.name || a.key).localeCompare(String(b.name || b.key), "zh-CN"))) {
    const o = document.createElement("option");
    o.value = s.key;
    o.textContent = s.name || s.key;
    sel.appendChild(o);
  }
  if (![...sel.options].some(o => o.value === sourceSel)) sourceSel = "all";
  sel.value = sourceSel;
}

/* 卡片区域统一事件委托：加载更多 / 星标 / 点击标记已读 */
grid.addEventListener("click", (e) => {
  const dupbtn = e.target.closest(".dupbtn");
  if (dupbtn) {
    e.preventDefault();
    const list = dupbtn.parentElement.querySelector(".duplist");
    list.hidden = !list.hidden;
    const n = list.querySelectorAll(".dupitem").length;
    dupbtn.textContent = list.hidden ? "＋ 另有 " + n + " 条相同报道" : "－ 收起相同报道";
    return;
  }
  const dupitem = e.target.closest(".dupitem");
  if (dupitem) {
    e.preventDefault();
    window.open(dupitem.dataset.link, "_blank", "noopener");
    return;
  }
  if (e.target.closest("#loadMore")) {
    shownCount += PAGE_STEP;
    render();
    return;
  }
  const star = e.target.closest(".star");
  if (star) {
    e.preventDefault();
    const link = star.closest("a.card").getAttribute("href");
    if (stars[link]) delete stars[link]; else stars[link] = Date.now();
    saveMap("aihub_star", stars);
    const on = !!stars[link];
    star.classList.toggle("on", on);
    star.textContent = on ? "★" : "☆";
    star.title = on ? "取消收藏" : "收藏";
    if (quick === "star") render();
    return;
  }
  const card = e.target.closest("a.card");
  if (card && !card.classList.contains("read")) {
    const link = card.getAttribute("href");
    reads[link] = Date.now();
    saveMap("aihub_read", reads);
    card.classList.add("read");
    const chip = card.querySelector(".newchip");
    if (chip) chip.remove();
    paintSummary(lastShown, lastInfo);
  }
});

$("#readAllBtn").addEventListener("click", () => {
  const now = Date.now();
  for (const r of lastShown) reads[r.link] = now;
  saveMap("aihub_read", reads);
  render();
});

$("#sourceSel").addEventListener("change", (e) => {
  sourceSel = e.target.value;
  localStorage.setItem("aihub_fsource", sourceSel);
  shownCount = PAGE_STEP;
  render();
});

/* ---------- 主题订阅行 ---------- */
function renderTopicRow() {
  const row = $("#topicRow");
  const manage = $("#topicManage");
  row.querySelectorAll("button:not(#topicManage)").forEach(b => b.remove());
  for (const t of allTopics()) {
    const b = document.createElement("button");
    b.dataset.v = t.id;
    b.textContent = t.name;
    b.classList.toggle("on", t.id === stopic);
    row.insertBefore(b, manage);
  }
}
$("#topicRow").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b || b.id === "topicManage") return;
  stopic = b.dataset.v;
  localStorage.setItem("aihub_ftopic", stopic);
  shownCount = PAGE_STEP;
  renderTopicRow();
  render();
});
$("#topicManage").addEventListener("click", () => {
  const f = $("#topicForm");
  f.hidden = !f.hidden;
  renderTopicList();
});
$("#topicSave").addEventListener("click", () => {
  const name = $("#topicName").value.trim().slice(0, 16);
  const rx = $("#topicRx").value.trim();
  if (!name || !rx) return;
  try { new RegExp(rx, "i"); } catch { $("#topicRx").style.borderColor = "#ff5b5b"; return; }
  $("#topicRx").style.borderColor = "";
  customs.push({ id: "c_" + Date.now(), name, rx });
  localStorage.setItem("aihub_topics", JSON.stringify(customs));
  $("#topicName").value = ""; $("#topicRx").value = "";
  renderTopicRow();
  renderTopicList();
});
function renderTopicList() {
  const box = $("#topicList");
  box.innerHTML = "";
  for (const t of customs) {
    const chip = document.createElement("span");
    chip.className = "delchip";
    chip.appendChild(document.createTextNode(t.name));
    const x = document.createElement("button");
    x.type = "button"; x.textContent = "✕"; x.title = "删除该主题";
    x.addEventListener("click", () => {
      customs = customs.filter(c => c.id !== t.id);
      localStorage.setItem("aihub_topics", JSON.stringify(customs));
      if (stopic === t.id) { stopic = "all"; localStorage.setItem("aihub_ftopic", "all"); }
      renderTopicRow(); renderTopicList(); render();
    });
    chip.appendChild(x);
    box.appendChild(chip);
  }
}

/* ---------- 关键词屏蔽 ---------- */
function renderMutePanel() {
  $("#muteOn").checked = !!MUTE.on;
  $("#muteRules").value = (MUTE.rules || []).join("\n");

$("#muteSave").addEventListener("click", () => {

});

/* ---------- 导出 Markdown / JSON ---------- */
function stamp() { return new Date().toISOString().slice(0, 10); }
function download(name, content, mime) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], { type: mime + ";charset=utf-8" }));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
$("#exportMd").addEventListener("click", () => {
  const esc = (s) => String(s).replace(/[\\`\[\]()]/g, "\\$&");
  const lines = ["# AI 情报站 · 筛选结果导出", "", "- 导出时间：" + new Date().toLocaleString("zh-CN"), "- 条数：" + lastShown.length, ""];
  for (const r of lastShown) {
    const s = lastInfo[r.src] || {};
    lines.push("## [" + esc(r.title) + "](" + r.link + ")");
    lines.push("");
    lines.push((s.name || r.src) + " · " + (r.ts ? new Date(r.ts).toLocaleString("zh-CN") : "时间未知") + (r.dupCount > 0 ? " · 另有 " + r.dupCount + " 条相同报道" : ""));
    if (r.snippet) { lines.push(""); lines.push(r.snippet); }
    lines.push("");
  }
  download("ai-hub-export-" + stamp() + ".md", lines.join("\n"), "text/markdown");
});
$("#exportJson").addEventListener("click", () => {
  download("ai-hub-export-" + stamp() + ".json", JSON.stringify({
    exportedAt: new Date().toISOString(),
    filters: { ftype, flang, sourceSel, quick, stopic, q },
    count: lastShown.length,
    items: lastShown
  }, null, 2), "application/json");
});

/* ---------- 源健康看板 ---------- */
$("#statsBtn").addEventListener("click", async () => {
  const mask = $("#statsMask");
  mask.hidden = false;
  const body = $("#statsBody");
  $("#statsMeta").textContent = "";
  body.innerHTML = '<div class="empty" style="padding:30px 0">加载中…</div>';
  try {
    const j = await (await fetch("/api/stats")).json();
    const agoTxt = (ms) => {
      if (ms == null) return "从未成功";
      const m = Math.floor(ms / 60000);
      if (m < 1) return "刚刚";
      if (m < 60) return m + " 分钟前";
      if (m < 1440) return Math.floor(m / 60) + " 小时前";
      return Math.floor(m / 1440) + " 天前";
    };
    $("#statsMeta").textContent = "缓存更新于 " + (j.cacheTs ? new Date(j.cacheTs).toLocaleString("zh-CN") : "—") + " · 共 " + j.sources.length + " 个源";
    body.innerHTML = "";
    for (const s of j.sources) {
      const cls = s.error ? "err" : (!s.lastOk || s.failStreak > 0 || (s.lastOkAgoMs != null && s.lastOkAgoMs > 30 * 60 * 1000)) ? "warn" : "ok";
      const row = document.createElement("div");
      row.className = "srcrow";
      const dot = document.createElement("span");
      dot.className = cls;
      dot.textContent = "●";
      const nm = document.createElement("b");
      nm.textContent = s.name;
      const inf = document.createElement("span");
      inf.style.color = "var(--muted)";
      inf.textContent = s.kind + " · " + s.type + " · " + s.lang + " · " + s.items + " 条 · 成功 " + agoTxt(s.lastOkAgoMs) + (s.conditional ? " · 304" : "") + (s.failStreak ? " · 连败 " + s.failStreak : "");
      row.append(dot, nm, inf);
      if (s.error) {
        const el = document.createElement("div");
        el.className = "errline";
        el.textContent = "✕ " + s.error;
        row.appendChild(el);
      }
      body.appendChild(row);
    }
  } catch {
    body.innerHTML = '<div class="empty" style="padding:30px 0">无法读取 /api/stats</div>';
  }
});
$("#statsClose").addEventListener("click", () => { $("#statsMask").hidden = true; });
$("#statsMask").addEventListener("click", (e) => { if (e.target === $("#statsMask")) $("#statsMask").hidden = true; });

/* ---------- 深浅色主题 ---------- */
function applyTheme() {
  const eff = theme === "auto" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : theme;
  document.documentElement.dataset.theme = eff;
  document.documentElement.style.colorScheme = eff;
  const btn = $("#themeBtn");
  btn.textContent = theme === "auto" ? "🌓" : theme === "light" ? "☀️" : "🌙";
  btn.title = "主题：" + ({ auto: "跟随系统", light: "浅色", dark: "深色" })[theme];
  render(); /* 主题切换后按新配色重绘徽章 */
}
$("#themeBtn").addEventListener("click", () => {
  theme = theme === "auto" ? "light" : theme === "light" ? "dark" : "auto";
  localStorage.setItem("aihub_theme", theme);
  applyTheme();
});
matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => { if (theme === "auto") applyTheme(); });

/* ---------- GitHub 周热榜 ---------- */
let trendHide = localStorage.getItem("aihub_trendhide") === "1";
async function loadTrending() {
  try {
    const j = await (await fetch("/api/trending")).json();
    if (!j.items || !j.items.length) { $("#trendSec").hidden = true; return; }
    $("#trendMeta").textContent = "周起 " + j.week + " · 每周一更新" + (j.updatedAt ? " · 抓取于 " + new Date(j.updatedAt).toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "");
    const grid = $("#trendGrid");
    grid.innerHTML = "";
    j.items.forEach((it, i) => {
      const a = document.createElement("a");
      a.className = "trendrow";
      a.href = it.url; a.target = "_blank"; a.rel = "noopener";
      const l1 = document.createElement("span");
      l1.className = "trendline1";
      const rk = document.createElement("span"); rk.className = "trendrank"; rk.textContent = String(i + 1);
      const nm = document.createElement("span"); nm.className = "trendname"; nm.textContent = it.full;
      const st = document.createElement("span"); st.className = "trendstars";
      st.textContent = "★ " + (it.starsWeek ? it.starsWeek.toLocaleString("zh-CN") + " / 周" : String(it.starsTotal || ""));
      l1.append(rk, nm, st);
      a.appendChild(l1);
      if (it.desc) { const d = document.createElement("span"); d.className = "trenddesc"; d.textContent = it.desc; a.appendChild(d); }
      if (it.lang) { const l = document.createElement("span"); l.className = "trendlang"; l.textContent = it.lang; a.appendChild(l); }
      grid.appendChild(a);
    });
    $("#trendSec").hidden = trendHide ? true : sec !== "trend";
    applySecVisibility();
  } catch { $("#trendSec").hidden = true; }
}
$("#trendToggle").addEventListener("click", () => {
  trendHide = !trendHide;
  localStorage.setItem("aihub_trendhide", trendHide ? "1" : "0");
  applySecVisibility();
});
/* ---------- 板块导航：AI 资讯 / 手机上新 / GitHub 周榜 ---------- */
function applySecVisibility() {
  const trendTab = sec === "trend";
  $("#grid").style.display = trendTab ? "none" : "";
  $("#trendSec").hidden = !trendTab || trendHide;
  $("#trendToggle").textContent = trendHide ? "展开" : "收起";
}
$("#secRow").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  sec = b.dataset.sec;
  localStorage.setItem("aihub_sec", sec);
  shownCount = PAGE_STEP;
  $("#secRow").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  applySecVisibility();
  render();
});
loadTrending();
$("#secRow").querySelectorAll("button").forEach(x => x.classList.toggle("on", x.dataset.sec === sec));
applySecVisibility();

/* ---------- 筛选区折叠（默认收起，状态记忆） ---------- */
let filterShow = localStorage.getItem("aihub_filtershow") === "1";
function applyFilterVisibility() {
  $("#filterArea").hidden = !filterShow;
  $("#filterToggle").textContent = filterShow ? "⚙ 收起筛选" : "⚙ 筛选";
}
$("#filterToggle").addEventListener("click", () => {
  filterShow = !filterShow;
  localStorage.setItem("aihub_filtershow", filterShow ? "1" : "0");
  applyFilterVisibility();
});
applyFilterVisibility();

ftype = bindFilter("#typeRow", "aihub_ftype", (v) => { ftype = v; shownCount = PAGE_STEP; });
flang = bindFilter("#langRow", "aihub_flang", (v) => { flang = v; shownCount = PAGE_STEP; });
bindQuick();
renderTopicRow();
renderMutePanel();
applyTheme();
$("#search").addEventListener("input", (e) => { q = e.target.value; shownCount = PAGE_STEP; render(); });
$("#refresh").addEventListener("click", () => load(true));

load(false);
setInterval(() => load(false), 10 * 60 * 1000);
</script>
